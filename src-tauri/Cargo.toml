[package]
name = "radium-launcher"
version = "4.0.0"
description = "Radium — Custom Rec Room Private Server Launcher"
authors = ["abod124-sudo"]
edition = "2021"

[lib]
name = "radium_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json", "multipart", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
regex = "1"
futures-util = "0.3"
rfd = "0.15"
# Decode/resize/re-encode only. Default features pull in every format there is;
# the images this touches are the PNGs and JPEGs the two networks serve.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Optimise dependencies even in dev builds, while leaving this crate itself
# unoptimised so an edit still recompiles quickly.
#
# Without this, `npm run dev` runs the `image` crate and its PNG inflate at
# opt-level 0, where downscaling one 2560x1440 room thumbnail takes 1.36 s
# against 0.10 s built with optimisations — measured 2026-09-10 on the same
# file. A grid of twelve cards is the difference between a moment of work and
# a visibly stuttering desktop. Dependencies are compiled once and cached, so
# this costs one slow rebuild and nothing after it.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
